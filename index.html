<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>저시력 학생용 PDF 필기</title>
<link rel="stylesheet" href="styles.css?v=a72f8f4" />
</head>
<body>

<div id="signin-screen">
  <p id="signin-title">저시력 학생 필기 프로그램</p>
  <p id="signin-sub">구글 계정으로 로그인하면 시작할 수 있어요</p>
  <button id="signin-btn" class="big-open-btn" aria-label="구글 계정으로 로그인">
    <svg viewBox="0 0 24 24" width="30" height="30"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.94 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
    <span>구글 계정으로 로그인</span>
  </button>
  <p id="signin-status" aria-live="polite"></p>
</div>

<div id="app" class="no-pdf" hidden>
  <div id="modal-backdrop" hidden></div>

  <header id="toolbar" aria-label="도구 모음">
    <button id="open-btn" class="tbtn" aria-label="PDF 열기" title="PDF 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
      </svg>
    </button>

    <button id="toc-btn" class="tbtn" aria-label="목차" title="목차">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="14" y2="18"/>
      </svg>
    </button>

    <button id="favorite-btn" class="tbtn" aria-label="즐겨찾기" title="즐겨찾기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12,3 14.7,9.3 21.5,9.9 16.3,14.4 17.9,21 12,17.3 6.1,21 7.7,14.4 2.5,9.9 9.3,9.3"/>
      </svg>
    </button>

    <div class="tsep" role="separator"></div>

    <button id="select-btn" class="tbtn tool-btn" data-tool="select" aria-label="선택 (일반 마우스)" title="선택 (일반 마우스) - 드래그로 이동, Delete로 삭제">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
        <path d="M5 3 L5 18 L9 14.5 L11.5 20 L14 19 L11.5 13.5 L17 13 Z"/>
      </svg>
    </button>

    <div class="tsep" role="separator"></div>

    <button id="pen-btn" class="tbtn tool-btn" data-tool="pen" aria-label="펜" title="펜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="15,3 21,9 9,21 3,21 3,15" />
        <line x1="13" y1="5" x2="19" y2="11" />
      </svg>
    </button>

    <button id="highlighter-btn" class="tbtn tool-btn" data-tool="highlighter" aria-label="형광펜" title="형광펜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g transform="rotate(45 12 12)">
          <rect x="9" y="2" width="6" height="9" rx="1"/>
          <polygon points="9,11 15,11 12,16"/>
          <line x1="12" y1="16" x2="12" y2="21"/>
        </g>
      </svg>
    </button>

    <button id="eraser-btn" class="tbtn tool-btn" data-tool="eraser" aria-label="지우개" title="지우개">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g transform="rotate(-25 12 12)">
          <rect x="4.5" y="9" width="15" height="9" rx="2"/>
          <rect x="4.5" y="9" width="15" height="4.6" rx="2" fill="currentColor" stroke="none"/>
          <line x1="4.5" y1="13.6" x2="19.5" y2="13.6"/>
        </g>
      </svg>
    </button>

    <button id="text-btn" class="tbtn tool-btn" data-tool="text" aria-label="텍스트" title="텍스트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="5" x2="19" y2="5"/>
        <line x1="12" y1="5" x2="12" y2="20"/>
      </svg>
    </button>

    <div class="tsep" role="separator"></div>

    <button id="zoom-out-btn" class="tbtn" aria-label="축소" title="축소">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>

    <input id="zoom-level" class="edit-field" type="text" inputmode="numeric" readonly value="100%" aria-label="확대 배율 (클릭하여 직접 입력)" title="클릭하여 배율 직접 입력" />

    <button id="zoom-in-btn" class="tbtn" aria-label="확대" title="확대">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>

    <div class="tsep" role="separator"></div>

    <button id="prev-page-btn" class="tbtn" aria-label="이전 페이지" title="이전 페이지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <input id="page-indicator" class="edit-field" type="text" inputmode="numeric" readonly value="- / -" aria-label="페이지 번호 (클릭하여 이동)" title="클릭하여 원하는 페이지로 이동" />
    <button id="next-page-btn" class="tbtn" aria-label="다음 페이지" title="다음 페이지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="tflex"></div>

    <button id="export-btn" class="tbtn" aria-label="필기 포함 PDF로 내보내기" title="필기 포함 PDF로 내보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/>
        <polyline points="7 10 12 15 17 10"/>
        <path d="M4 19h16"/>
      </svg>
    </button>

    <button id="feedback-btn" class="tbtn" aria-label="불편한 점 알리기" title="불편한 점 알리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5.882V19.24a1.76 1.76 0 0 1-3.417.592l-2.147-6.15M18 13a3 3 0 1 0 0-6M5.436 13.683A4.001 4.001 0 0 1 7 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 0 1-1.564-.317z"/>
      </svg>
    </button>

    <button id="signout-btn" class="tbtn" aria-label="로그아웃" title="로그아웃">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>

    <span id="autosave-status" aria-live="polite">자동저장됨</span>
  </header>

  <div id="tabbar" aria-label="열린 PDF 목록"></div>

  <main id="viewer-wrap">
    <div id="viewer">
      <div id="page-container">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="committed-canvas"></canvas>
        <canvas id="active-canvas"></canvas>
      </div>
    </div>

    <div id="empty-state">
      <p>학습할 PDF 교재를 열어주세요</p>
      <button id="empty-open-btn" class="big-open-btn" aria-label="PDF 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        </svg>
        <span>PDF 열기</span>
      </button>
    </div>

    <div id="tool-popup" hidden></div>
    <div id="toc-popup" hidden></div>
    <div id="favorite-popup" hidden></div>
    <div id="feedback-popup" hidden></div>

    <div id="export-popup" hidden>
      <button id="export-close-btn" class="popup-close-btn" aria-label="닫기">×</button>
      <p class="popup-label">내보낼 파일 이름</p>
      <input id="export-filename-input" class="toc-add-input" type="text" aria-label="내보낼 파일 이름" />
      <div class="feedback-btn-row">
        <button id="export-cancel-btn" class="feedback-cancel-btn">취소</button>
        <button id="export-confirm-btn" class="feedback-submit-btn">저장</button>
      </div>
    </div>
  </main>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="vendor/fontkit/fontkit.umd.js"></script>
<script type="module" src="app.js?v=a72f8f4"></script>
</body>
</html>
